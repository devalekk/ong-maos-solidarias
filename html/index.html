<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <title>ONG - Página Inicial</title>
</head>

<body>

    <!-- Link de acessibilidade para pular diretamente ao conteúdo -->
    <a href="#app" class="skip-link">
        Ir para o conteúdo principal
    </a>

    <header>
        <h1>ONG Mãos Solidárias</h1>
    </header>

    <nav
        class="menu-principal"
        aria-label="Navegação principal"
    >

        <!-- Botão acessível do menu mobile -->
        <button
            type="button"
            id="botao-menu"
            class="menu-hamburguer"
            aria-controls="menu-lista"
            aria-expanded="false"
            aria-label="Abrir menu de navegação"
        >
            <span aria-hidden="true">☰</span>
        </button>

        <ul
            class="menu-lista"
            id="menu-lista"
        >

            <li>
                <a
                    href="#inicio"
                    data-rota="inicio"
                >
                    Início
                </a>
            </li>

            <li class="dropdown">

                <a
                    href="#projetos"
                    data-rota="projetos"
                >
                    Projetos
                </a>

                <ul
                    class="submenu"
                    aria-label="Submenu de projetos"
                >

                    <li>
                        <a
                            href="#projetos"
                            data-rota="projetos"
                        >
                            Nossos projetos
                        </a>
                    </li>

                    <li>
                        <a
                            href="#projetos"
                            data-rota="projetos"
                        >
                            Doações
                        </a>
                    </li>

                    <li>
                        <a
                            href="#projetos"
                            data-rota="projetos"
                        >
                            Voluntariado
                        </a>
                    </li>

                </ul>

            </li>

            <li>
                <a
                    href="#cadastro"
                    data-rota="cadastro"
                >
                    Cadastro
                </a>
            </li>

        </ul>

    </nav>

    <main
        id="app"
        class="inicio-grid"
        tabindex="-1"
    >
    </main>

    <footer>

        <p>
            ONG Mãos Solidárias -
            Todos os direitos reservados.
        </p>

        <p id="data-atualizacao"></p>

    </footer>

    <!-- Biblioteca Day.js -->
    <script
        src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js">
    </script>

    <!-- JavaScript principal -->
    <script
        type="module"
        src="../js/app.js">
    </script>

</body>

</html>
